<!DOCTYPE html>
<html>
<head>
    <title>User Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h2>Enter Your Details</h2>

        <input type="text" class="input-field" placeholder="User ID">
        <input type="text" class="input-field" placeholder="Username">
        <input type="number" class="input-field" placeholder="Age">
        <input type="text" class="input-field" placeholder="Mobile Number">
        <input type="date" class="input-field" placeholder="DOB">
        <input type="text" class="input-field" placeholder="Address">

        <!-- Button click hone par login() function chalega -->
        <button class="btn" onclick="login()">Submit Details</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
